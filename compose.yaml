services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: siteguard
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/local-roles.sql:/docker-entrypoint-initdb.d/local-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "siteguard"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
